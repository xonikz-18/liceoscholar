<div class="page">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo" aria-hidden="true"></div>
      <div class="brand-text">
        <strong>Liceo de Cagayan University</strong>
        <span>Scholarship Automation</span>
      </div>
    </div>

    <nav class="menu" aria-label="Admin navigation">
      <button class="menu-item" type="button" (click)="openStudentList()">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.25"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
          <path d="M5 7a4 4 0 1 0 8 0a4 4 0 1 0 -8 0"/>
          <path d="M3 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          <path d="M21 21v-2a4 4 0 0 0 -3 -3.85"/>
        </svg>
        <span>Student List</span>
      </button>
      <button class="menu-item active" type="button" aria-current="page">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.25"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
          <path d="M8 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0"/>
          <path d="M6 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2"/>
        </svg>
        <span>Admin Profile</span>
      </button>
    </nav>

    <div class="logout-item">
      <button class="logout-hover" type="button" (click)="logout()">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.25"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
            <path d="M14 8v-2a2 2 0 0 0 -2 -2h-7a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h7a2 2 0 0 0 2 -2v-2"/>
            <path d="M9 12h12l-3 -3"/>
            <path d="M18 15l3 -3"/>
          </svg>
          <span>Log Out</span>
        </button>
    </div>
  </aside>

  <main class="content">
    <section class="profile" aria-labelledby="profile-title">
      <h1 id="profile-title">Personal Information</h1>
      <app-profile-photo-editor
        class="admin-photo"
        defaultImage="admin-default"
        storageKey="adminProfilePhoto"
      ></app-profile-photo-editor>

      <div class="details">
        <div class="full-name-field">
          <label for="admin-full-name">Full Name</label>
          <input id="admin-full-name" [value]="admin.name" readonly>
        </div>

        <div class="additional-details">
          <div>
            <label for="admin-suffix">Suffix</label>
            <input id="admin-suffix" [value]="admin.suffix" readonly>
          </div>
          <div>
            <label for="admin-dob">Date of Birth</label>
            <input id="admin-dob" [value]="admin.dateOfBirth" readonly>
          </div>
          <div>
            <label for="admin-sex">Sex</label>
            <input id="admin-sex" [value]="admin.sex" readonly>
          </div>
        </div>
      </div>
    </section>
  </main>
</div>
