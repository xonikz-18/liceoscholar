<div class="logout-screen">
  <app-adminprofile *ngIf="isAdminProfile"></app-adminprofile>
  <app-adminstudentview *ngIf="isAdminStudentDetail" [studentId]="studentId"></app-adminstudentview>
  <app-adminstudentlist *ngIf="isAdminStudentList"></app-adminstudentlist>
  <app-studentview *ngIf="isStudentView"></app-studentview>

  <div class="overlay"></div>

  <div class="logout-modal">
    <h2>Log Out</h2>
    <p>Are you sure you want to log out of your account?</p>

    <div class="actions">
      <button type="button" class="cancel" (click)="cancel()">Cancel</button>
      <button type="button" class="confirm" (click)="confirm()">Log Out</button>
    </div>
  </div>
</div>
