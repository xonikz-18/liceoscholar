<div class="page" (keydown.escape)="activeFilter = null">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo" aria-hidden="true"></div>
      <div class="brand-text">
        <strong>Liceo de Cagayan University</strong>
        <span>Scholarship Automation</span>
      </div>
    </div>

    <nav class="menu" aria-label="Admin navigation">
      <button class="menu-item active" type="button" aria-current="page">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.25"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
          <path d="M5 7a4 4 0 1 0 8 0a4 4 0 1 0 -8 0"/>
          <path d="M3 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          <path d="M21 21v-2a4 4 0 0 0 -3 -3.85"/>
        </svg>
        <span>Student List</span>
      </button>
      <button class="menu-item" type="button" (click)="openAdminProfile()">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.25"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
          <path d="M8 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0"/>
          <path d="M6 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2"/>
        </svg>
        <span>Admin Profile</span>
      </button>
    </nav>

    <div class="logout-item">
      <button class="logout-hover" type="button" (click)="logout()">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.25"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
            <path d="M14 8v-2a2 2 0 0 0 -2 -2h-7a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h7a2 2 0 0 0 2 -2v-2"/>
            <path d="M9 12h12l-3 -3"/>
            <path d="M18 15l3 -3"/>
          </svg>
          <span>Log Out</span>
        </button>
    </div>
  </aside>

  <main class="content">
    <section class="student-list" aria-label="Student list">
      <label class="search-box">
        <span class="search-icon" aria-hidden="true"></span>
        <input
          type="search"
          name="studentSearch"
          [(ngModel)]="searchTerm"
          placeholder="Search"
          aria-label="Search students"
        >
      </label>

      <div class="filters">
        <div class="filter" *ngFor="let key of filterKeys">
          <button
            class="filter-button"
            type="button"
            [attr.aria-expanded]="activeFilter === key"
            (click)="toggleFilter(key)"
          >
            <span>{{ filterLabels[key] }}</span>
            <span class="chevron" aria-hidden="true"></span>
          </button>

          <div class="filter-menu" *ngIf="activeFilter === key">
            <button
              type="button"
              [class.selected]="selectedFilters[key] === 'All'"
              [attr.aria-pressed]="selectedFilters[key] === 'All'"
              (click)="chooseFilter(key, 'All')"
            >
              All
            </button>
            <button
              type="button"
              *ngFor="let option of filterOptions[key]"
              [class.selected]="selectedFilters[key] === option"
              [attr.aria-pressed]="selectedFilters[key] === option"
              (click)="chooseFilter(key, option)"
            >
              {{ option }}
            </button>
          </div>
        </div>
      </div>

      <div class="table-card">
        <div class="table-header student-row">
          <span>Status</span>
          <span>Full Name</span>
          <span>Course</span>
          <span>Year Level</span>
          <span>Scholarship Type</span>
        </div>

        <div class="student-row" *ngFor="let student of filteredStudents">
          <span class="status-cell">
            <span class="status-dot" [ngClass]="statusClass(student.status)" [attr.aria-label]="student.status"></span>
          </span>
          <button class="student-name" type="button" (click)="openStudent(student)">
            {{ student.name }}
          </button>
          <span>{{ student.course }}</span>
          <span>{{ student.yearLevel }}</span>
          <span>{{ student.scholarshipType }}</span>
        </div>

        <p class="empty-state" *ngIf="filteredStudents.length === 0">No students match your search or filters.</p>
      </div>
    </section>
  </main>
</div>
