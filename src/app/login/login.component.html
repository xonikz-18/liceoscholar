<div class="auth-page">
  <section class="brand-panel"></section>

  <section class="form-panel">
    <div class="form-box">
      <div class="tabs">
        <span class="slider" [class.slide-right]="switching"></span>
        <button type="button" class="active">Log In</button>
        <button type="button" (click)="goToSignup()">Sign Up</button>
      </div>

      <form [class.fade-in]="animateForm" (ngSubmit)="login()">
        <div class="email-field">
          <label for="loginEmail">School E-mail or Admin Username</label>
          <input
            id="loginEmail"
            type="text"
            name="loginEmail"
            [(ngModel)]="loginEmail"
            (ngModelChange)="clearLoginError()"
            required
          >
        </div>

        <label for="loginPassword">Password</label>
        <div class="password-field">
          <input
            id="loginPassword"
            [type]="showPassword ? 'text' : 'password'"
            name="loginPassword"
            [(ngModel)]="loginPassword"
            (ngModelChange)="clearLoginError()"
            required
          >
          <button
            class="password-toggle"
            type="button"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
            [attr.aria-pressed]="showPassword"
            (click)="showPassword = !showPassword"
          >
            <svg *ngIf="showPassword" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12Z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg *ngIf="!showPassword" viewBox="0 0 24 24" aria-hidden="true">
              <path d="m3 3 18 18M10.6 6.2A10.8 10.8 0 0 1 12 6c6.4 0 10 6 10 6a15.8 15.8 0 0 1-4.1 4.4M6.2 6.2C3.5 8 2 12 2 12s3.6 6 10 6a10.8 10.8 0 0 0 3.1-.5"></path>
              <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path>
            </svg>
          </button>
        </div>

        <button type="button" class="forgot" (click)="forgotPassword()">Forgot Password?</button>
        <button type="submit" class="submit">Log In</button>
        <p class="login-error" *ngIf="loginError" role="alert">{{ loginError }}</p>
      </form>

      <div class="bottom-message">
        Don't have an Account?
        <button type="button" (click)="goToSignup()">Sign Up</button>
      </div>
    </div>
  </section>
</div>
