<div class="page">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo"></div>
      <div class="brand-text">
        <strong>Liceo de Cagayan University</strong>
        <span>Scholarship Automation</span>
      </div>
    </div>

    <button class="menu-item profile-item" type="button">
      <span class="user-icon"></span>
      <span>Student Profile</span>
    </button>

    <div class="logout-item">
      <button class="logout-hover" type="button" (click)="logout()">Log Out</button>
    </div>
  </aside>

  <main class="content">
    <div class="workspace">
      <section class="profile">
        <div class="section-title">
          <span>Personal Information</span>
          <span class="lock-icon"></span>
        </div>

        <div class="profile-grid">
          <app-profile-photo-editor
            class="student-photo"
            defaultImage="student-default"
            storageKey="studentProfilePhoto"
          ></app-profile-photo-editor>

          <div class="details">
            <div class="row">
              <div class="name-field">
                <label>Last Name, First Name M.I.</label>
                <input [value]="profile.name" readonly>
              </div>

              <div class="suffix-field">
                <label>Suffix</label>
                <input value="N/A" readonly>
              </div>
            </div>

            <div class="row">
              <div class="course-field">
                <label>Course</label>
                <input [value]="profile.course" readonly>
              </div>

              <div class="year-field">
                <label>Year Level</label>
                <input [value]="profile.yearLevel" readonly>
              </div>

              <div class="age-field">
                <label>Age</label>
                <input [value]="profile.age" readonly>
              </div>
            </div>

            <div class="row">
              <div class="sex-field">
                <label>Sex</label>
                <input [value]="profile.sex" readonly>
              </div>

              <div class="scholar-field">
                <label>Scholarship Type</label>
                <input [value]="profile.scholarshipType" readonly>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="requirements">
        <div class="section-title">
          <span>Submission Requirement</span>
          <span class="info" aria-label="Submission requirement help"></span>
        </div>

        <div class="req-card">
          <div class="req-row" *ngFor="let req of requirements; let i = index">
            <span class="date">{{ req.date }}</span>
            <span class="separator" aria-hidden="true">•</span>

            <div class="file-cell">
              <ng-container *ngIf="req.fileName; else uploadTemplate">
                <button
                  type="button"
                  class="file-name"
                  (click)="previewFile(i)"
                >
                  {{ truncateFileName(req.fileName) }}
                </button>

                <button
                  type="button"
                  class="remove-file"
                  (click)="removeFile(i)"
                >
                  ×
                </button>
              </ng-container>

              <ng-template #uploadTemplate>
                <input
                  class="file-input"
                  [id]="'upload-' + i"
                  type="file"
                  accept=".jpg,.jpeg,.png,.pdf,.doc,.docx,.xls,.xlsx"
                  (change)="onFileSelected($event, i)"
                >

                <label
                  class="upload"
                  [for]="'upload-' + i"
                >
                  Upload
                </label>
              </ng-template>
            </div>

            <span class="description">{{ req.description }}</span>

            <b [class]="req.status.toLowerCase()">
              {{ req.status }}
            </b>
          </div>
        </div>
      </section>
    </div>
  </main>

  <div
    class="preview-overlay"
    *ngIf="preview"
    (click)="closePreview()"
  >
    <div
      class="preview-modal"
      (click)="$event.stopPropagation()"
    >
      <button
        type="button"
        class="close-preview"
        (click)="closePreview()"
      >
        ×
      </button>

      <h3>{{ preview.fileName }}</h3>

      <img
        *ngIf="preview.type.startsWith('image/')"
        [src]="preview.dataUrl"
        alt="Preview"
        class="preview-image"
      >

      <iframe
        *ngIf="preview.type === 'application/pdf'"
        [src]="preview.safeUrl"
        class="preview-pdf"
      ></iframe>

      <div
        *ngIf="preview.isDocument"
        class="document-preview"
      >
        <div class="document-icon">📄</div>
        <strong>{{ preview.fileName }}</strong>
        <span>{{ preview.type || 'Document file' }}</span>
      </div>
    </div>
  </div>
</div>
